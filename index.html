<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遺留物管理中心 | Boutique Lost & Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        custom: {
                            base: '#f2f0ed',   /* Strict Background */
                            dark: '#666464',   /* Strict Text & Borders */
                            accent: '#72c3d7', /* Strict Primary & Highlights */
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px rgba(102, 100, 100, 0.05)',
                        'inner-light': 'inset 0 2px 4px 0 rgba(102, 100, 100, 0.03)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #f2f0ed;
            color: #666464;
            -webkit-font-smoothing: antialiased;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(102, 100, 100, 0.15); border-radius: 10px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: rgba(102, 100, 100, 0.3); }

        .modal-enter { opacity: 0; transform: scale(0.98) translateY(5px); }
        .modal-enter-active { opacity: 1; transform: scale(1) translateY(0); transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #72c3d7;
            box-shadow: 0 0 0 2px rgba(114, 195, 215, 0.15);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.5;
            transition: 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 0.8; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans text-custom-dark relative">

    <!-- Loading Overlay (僅在登入或初次載入時顯示) -->
    <div id="loading-overlay" class="hidden absolute inset-0 bg-custom-base/80 backdrop-blur-[2px] z-[100] flex-col items-center justify-center">
        <i class="fas fa-circle-notch fa-spin text-4xl text-custom-accent mb-4"></i>
        <p class="text-custom-dark font-bold tracking-widest text-sm uppercase">資料同步中</p>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[70] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-custom-base">
        <div class="bg-white p-10 rounded-2xl shadow-soft w-full max-w-sm mx-4 relative overflow-hidden border border-custom-dark/10">
            <div class="absolute top-0 left-0 w-full h-1 bg-custom-accent"></div>
            <div class="text-center mb-8 mt-2">
                <div class="w-14 h-14 bg-custom-base rounded-full flex items-center justify-center mx-auto mb-4 border border-custom-dark/5">
                    <i class="fas fa-box-open text-xl text-custom-accent"></i>
                </div>
                <h1 class="text-xl font-bold text-custom-dark tracking-wide">遺留物管理系統</h1>
                <p class="text-custom-dark/50 mt-1 text-xs tracking-widest uppercase font-medium">Boutique Lost & Found</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <input type="text" id="username" required autocomplete="off"
                           class="w-full bg-custom-base/30 border border-custom-dark/20 px-4 py-3 rounded-lg transition-all text-custom-dark text-center placeholder-custom-dark/40 font-medium text-sm" 
                           placeholder="登入帳號">
                </div>
                <div>
                    <input type="password" id="password" required autocomplete="off"
                           class="w-full bg-custom-base/30 border border-custom-dark/20 px-4 py-3 rounded-lg transition-all text-custom-dark text-center placeholder-custom-dark/40 font-medium text-sm" 
                           placeholder="登入密碼">
                </div>
                <button type="submit" class="w-full bg-custom-accent hover:opacity-90 text-white font-bold py-3 rounded-lg transition-colors mt-2">
                    登入系統
                </button>
            </form>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="hidden flex-col h-full w-full">
        <!-- Top Navbar -->
        <nav class="bg-white shrink-0 z-20 shadow-sm border-b border-custom-dark/10">
            <div class="max-w-6xl mx-auto px-4 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-box-open text-custom-accent text-lg"></i>
                        <h1 class="font-bold text-base md:text-lg tracking-wide whitespace-nowrap">遺留物管理</h1>
                    </div>
                    
                    <div class="flex items-center gap-2 md:gap-4">
                        <button onclick="openAddModal()" class="bg-custom-accent hover:opacity-90 text-white px-3 py-2 md:px-4 rounded-lg text-sm font-bold transition-all flex items-center gap-2 whitespace-nowrap">
                            <i class="fas fa-plus"></i> <span class="hidden md:inline">新增物品</span>
                        </button>
                        
                        <button onclick="switchToDeletedZone()" id="btn-deleted-zone" class="bg-custom-base hover:bg-custom-dark hover:text-white text-custom-dark px-3 py-2 md:px-4 border border-custom-dark/10 rounded-lg text-sm font-bold transition-all flex items-center gap-2 whitespace-nowrap">
                            <i class="fas fa-archive text-xs md:text-sm"></i> <span class="hidden md:inline">刪除區紀錄</span>
                        </button>
                        
                        <div class="h-6 w-px bg-custom-dark/10 mx-1 md:mx-2 hidden sm:block"></div>
                        
                        <div class="text-sm items-center gap-2 px-2 py-1 hidden sm:flex">
                            <i class="fas fa-user-circle text-custom-accent/70 text-lg"></i> 
                            <span id="display-username" class="font-medium"></span>
                        </div>
                        <button onclick="handleLogout()" class="text-custom-dark/50 hover:text-custom-dark transition-colors p-2" title="登出">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <div class="bg-white shrink-0 z-10 border-b border-custom-dark/10">
            <div class="max-w-6xl mx-auto px-6 lg:px-8">
                <div class="flex space-x-6 md:space-x-8 overflow-x-auto no-scrollbar">
                    <button class="tab-btn active group py-4 px-2 relative text-sm font-bold transition-colors whitespace-nowrap text-custom-dark flex items-center gap-2" data-tab="safe">
                        <span class="tracking-wider">保險箱</span>
                        <span id="count-safe" class="bg-custom-accent text-white px-2 py-0.5 rounded-full text-xs font-bold transition-all ml-1">0</span>
                        <div class="tab-indicator absolute bottom-0 left-0 w-full h-0.5 bg-custom-accent transition-all duration-300"></div>
                    </button>
                    
                    <button class="tab-btn group py-4 px-2 relative text-sm font-bold transition-colors whitespace-nowrap text-custom-dark/50 hover:text-custom-dark flex items-center gap-2" data-tab="retention">
                        <span class="tracking-wider">保留區</span>
                        <span id="count-retention" class="bg-custom-dark/10 text-custom-dark px-2 py-0.5 rounded-full text-xs font-bold transition-all ml-1">0</span>
                        <div class="tab-indicator absolute bottom-0 left-0 w-0 h-0.5 bg-custom-accent transition-all duration-300 group-hover:w-full"></div>
                    </button>
                </div>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto p-4 lg:p-8 relative flex flex-col items-center">
            <div class="w-full max-w-6xl flex flex-col h-full gap-5 flex-1">
                
                <div id="search-section" class="hidden shrink-0 w-full">
                    <div class="relative w-full max-w-md">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-custom-dark/40">
                            <i class="fas fa-search"></i>
                        </div>
                        <input type="text" id="search-input" 
                               class="w-full bg-white border border-custom-dark/20 rounded-lg pl-11 pr-4 py-2.5 focus:outline-none transition-all shadow-sm text-sm placeholder-custom-dark/40" 
                               placeholder="搜尋日期、房號、物品或關鍵字...">
                    </div>
                </div>

                <div id="interactive-section" class="shrink-0 flex flex-col gap-3 w-full">
                    <div id="months-grid" class="flex gap-2 lg:gap-3 overflow-x-auto pb-2 custom-scrollbar"></div>
                </div>

                <div class="flex-1 flex flex-col min-h-0 bg-white rounded-xl shadow-soft border border-custom-dark/10 w-full overflow-hidden relative">
                    <div class="flex items-center px-6 py-4 shrink-0 border-b border-custom-dark/10 bg-[#faf9f8] z-10">
                        <h3 id="list-title" class="font-bold text-base tracking-wide flex items-center gap-2"></h3>
                    </div>
                    
                    <div id="item-list-container" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col relative"></div>
                    
                    <div id="empty-state" class="hidden absolute inset-0 flex-col justify-center items-center text-custom-dark/50 bg-white z-0 mt-[60px]">
                        <i class="fas fa-folder-open text-3xl mb-3 opacity-30"></i>
                        <p id="empty-state-text" class="text-sm tracking-wide font-medium">這個月份沒有紀錄</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Item Modal -->
    <div id="add-modal" class="hidden fixed inset-0 bg-custom-dark/20 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col border border-custom-dark/10">
            <div class="px-6 py-5 flex justify-between items-center shrink-0 border-b border-custom-base">
                <h3 class="text-lg font-bold flex items-center gap-2">
                    <i class="fas fa-plus text-custom-accent text-sm"></i> 新增物品登記
                </h3>
                <button onclick="closeAddModal()" class="text-custom-dark/40 hover:text-custom-dark transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-custom-base">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-5 flex-1 bg-white">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-custom-dark/70 mb-1.5 uppercase tracking-wider">存放區域</label>
                        <select id="add-category" class="w-full bg-custom-base/50 border border-custom-dark/20 px-3 py-2.5 rounded-lg text-sm focus:bg-white transition-colors font-medium">
                            <option value="safe">保險箱</option>
                            <option value="retention">保留區</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-custom-dark/70 mb-1.5 uppercase tracking-wider">拾獲日期</label>
                        <input type="date" id="add-date" class="w-full bg-custom-base/50 border border-custom-dark/20 px-3 py-2.5 rounded-lg text-sm focus:bg-white transition-colors font-medium">
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-4">
                    <div class="col-span-1">
                        <label class="block text-xs font-bold text-custom-dark/70 mb-1.5 uppercase tracking-wider">房號</label>
                        <input type="text" id="add-room" class="w-full bg-custom-base/50 border border-custom-dark/20 px-3 py-2.5 rounded-lg text-sm focus:bg-white transition-colors font-medium" placeholder="例: 101">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-bold text-custom-dark/70 mb-1.5 uppercase tracking-wider">物品名稱</label>
                        <input type="text" id="add-name" class="w-full bg-custom-base/50 border border-custom-dark/20 px-3 py-2.5 rounded-lg text-sm focus:bg-white transition-colors font-medium" placeholder="例: 黑色皮夾">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-custom-dark/70 mb-1.5 uppercase tracking-wider">拾獲人 <span class="font-normal opacity-60 lowercase">(選填)</span></label>
                    <input type="text" id="add-finder" class="w-full bg-custom-base/50 border border-custom-dark/20 px-3 py-2.5 rounded-lg text-sm focus:bg-white transition-colors font-medium" placeholder="例: 房務員 王小明">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-custom-dark/70 mb-1.5 uppercase tracking-wider">備註事項 <span class="font-normal opacity-60 lowercase">(選填)</span></label>
                    <textarea id="add-note" rows="2" class="w-full bg-custom-base/50 border border-custom-dark/20 px-3 py-2.5 rounded-lg text-sm focus:bg-white transition-colors resize-none font-medium" placeholder="補充說明..."></textarea>
                </div>
            </div>
            
            <div class="bg-[#faf9f8] border-t border-custom-dark/10 px-6 py-4 flex justify-end gap-3 shrink-0">
                <button onclick="closeAddModal()" class="px-5 py-2 text-sm bg-white border border-custom-dark/20 hover:bg-custom-base rounded-lg font-bold transition-colors">取消</button>
                <button onclick="submitAddItem()" class="px-5 py-2 text-sm bg-custom-accent hover:opacity-90 text-white rounded-lg font-bold transition-colors">
                    確認新增
                </button>
            </div>
        </div>
    </div>

    <!-- Retrieve Modal -->
    <div id="retrieve-modal" class="hidden fixed inset-0 bg-custom-dark/20 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden transform transition-transform scale-95 opacity-0 border border-custom-dark/10" id="retrieve-modal-content">
            <div class="p-8 text-center relative">
                <button onclick="closeRetrieveModal()" class="absolute top-4 right-4 text-custom-dark/40 hover:text-custom-dark transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-custom-base">
                    <i class="fas fa-times"></i>
                </button>
                
                <h3 class="text-lg font-bold mb-1">物品取出作業</h3>
                <p class="text-custom-dark/60 text-sm mb-6 leading-relaxed">
                    房號 <span id="retrieve-room" class="font-bold text-custom-dark mx-1"></span><br>
                    <span id="retrieve-name" class="font-bold text-custom-dark text-base"></span>
                </p>
                
                <div class="flex flex-col gap-3">
                    <button onclick="executeRetrieve('guest')" class="w-full bg-white border border-custom-accent hover:bg-custom-accent hover:text-white text-custom-accent py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 font-bold text-sm">
                        <i class="fas fa-user-check"></i> 客人取走
                    </button>
                    
                    <button onclick="executeRetrieve('expired')" class="w-full bg-white border border-custom-dark/30 hover:border-custom-dark hover:bg-custom-dark hover:text-white text-custom-dark py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 font-bold text-sm">
                        <i class="fas fa-trash-alt text-xs"></i> 逾期整理
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ 貼上你的 Google Apps Script 部署網址
        const API_URL = "https://script.google.com/macros/s/AKfycbxCLUDHt9R22rFYW2VAYStejAOjlkyXQasyKVezQEexFxgL_yEdYXlImONzU0vwAAL8/exec";
        // ==========================================

        let currentUser = localStorage.getItem('boutique_lf_user_v7') || '';
        let currentPassword = localStorage.getItem('boutique_lf_pass_v7') || '';
        let currentTab = 'safe'; 
        let currentMonth = new Date().getMonth() + 1;
        let dbItems = [];
        let itemToRetrieve = null; 
        let searchQuery = '';

        const ui = {
            loadingOverlay: document.getElementById('loading-overlay'),
            loginScreen: document.getElementById('login-screen'),
            appScreen: document.getElementById('app-screen'),
            loginForm: document.getElementById('login-form'),
            usernameInput: document.getElementById('username'),
            passwordInput: document.getElementById('password'),
            displayUsername: document.getElementById('display-username'),
            
            tabBtns: document.querySelectorAll('.tab-btn'),
            btnDeletedZone: document.getElementById('btn-deleted-zone'),
            countSafe: document.getElementById('count-safe'),
            countRetention: document.getElementById('count-retention'),
            
            interactiveSection: document.getElementById('interactive-section'),
            monthsGrid: document.getElementById('months-grid'),
            searchSection: document.getElementById('search-section'),
            searchInput: document.getElementById('search-input'),
            
            listTitle: document.getElementById('list-title'),
            listContainer: document.getElementById('item-list-container'),
            emptyState: document.getElementById('empty-state'),
            emptyStateText: document.getElementById('empty-state-text'),

            addModal: document.getElementById('add-modal'),
            addDateInput: document.getElementById('add-date'),
            retrieveModal: document.getElementById('retrieve-modal'),
            retrieveModalContent: document.getElementById('retrieve-modal-content'),
        };

        window.onload = () => {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            ui.addDateInput.value = `${yyyy}-${mm}-${dd}`;

            ui.searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                renderList(true);
            });

            if (currentUser && currentPassword) {
                showApp();
                loadData();
            } else {
                showLogin();
            }
        };

        function toggleLoader(show) {
            ui.loadingOverlay.style.display = show ? 'flex' : 'none';
        }

        // --- 登入邏輯 ---
        ui.loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = ui.usernameInput.value.trim();
            const p = ui.passwordInput.value.trim();
            if(!u || !p) return showToast("請輸入帳號密碼", "error");
            
            toggleLoader(true);
            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", username: u, password: p })
                }).then(r => r.json());

                if(res.success) {
                    currentUser = res.user;
                    currentPassword = p;
                    localStorage.setItem('boutique_lf_user_v7', currentUser);
                    localStorage.setItem('boutique_lf_pass_v7', currentPassword);
                    showApp();
                    loadData();
                    showToast(`登入成功，歡迎 ${currentUser}`, 'success');
                } else {
                    showToast(res.message, 'error');
                }
            } catch(err) {
                showToast("登入連線失敗，請檢查網址", 'error');
            }
            toggleLoader(false);
        });

        // --- 讀取資料 (有載入畫面) ---
        async function loadData() {
            toggleLoader(true);
            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getData", username: currentUser, password: currentPassword }) 
                }).then(r => r.json());
                
                if(res.success) {
                    processFetchedData(res.data);
                    renderView();
                } else {
                    showToast("授權已過期或密碼錯誤，請重新登入", "error");
                    handleLogout();
                }
            } catch (e) {
                showToast("讀取資料失敗", "error");
            }
            toggleLoader(false);
        }

        // --- 背景默默同步 (無載入畫面) ---
        async function loadDataBackground() {
            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getData", username: currentUser, password: currentPassword }) 
                }).then(r => r.json());
                
                if(res.success) {
                    processFetchedData(res.data);
                    renderView();
                }
            } catch (e) {
                console.log("背景同步失敗", e);
            }
        }

        // 每 5 分鐘自動背景同步
        setInterval(() => {
            if (currentUser) loadDataBackground();
        }, 5 * 60 * 1000);

        function processFetchedData(data) {
            dbItems = [];
            (data.valuable || []).forEach(d => {
                dbItems.push({
                    id: d['ID'], category: 'safe', date: d['日期'], month: parseInt(d['月份']),
                    room: d['房號'], name: d['物品名稱'], finder: d['拾獲人'], note: d['備註'],
                    status: 'active', addedBy: d['建立者'] || '系統'
                });
            });
            (data.soon || []).forEach(d => {
                dbItems.push({
                    id: d['ID'], category: 'retention', date: d['日期'], month: parseInt(d['月份']),
                    room: d['房號'], name: d['物品名稱'], finder: d['拾獲人'], note: d['備註'],
                    status: 'active', addedBy: d['建立者'] || '系統'
                });
            });
            (data.deleted || []).forEach(d => {
                dbItems.push({
                    id: d['ID'], category: d['原區域'] === '保險箱' ? 'safe' : 'retention',
                    date: d['日期'], month: parseInt(d['月份']), room: d['房號'],
                    name: d['物品名稱'], finder: d['拾獲人'], note: d['備註'], status: 'deleted', 
                    deleteReason: d['狀態'] === '客人取走' ? 'guest' : 'expired',
                    deletedBy: d['處理人'] || '系統', deletedAtStr: d['處理時間']
                });
            });
        }

        function handleLogout() {
            currentUser = '';
            currentPassword = '';
            localStorage.removeItem('boutique_lf_user_v7');
            localStorage.removeItem('boutique_lf_pass_v7');
            showLogin();
        }

        function showApp() {
            ui.loginScreen.classList.add('hidden');
            ui.appScreen.classList.remove('hidden');
            ui.appScreen.classList.add('flex');
            ui.displayUsername.innerText = currentUser;
        }

        function showLogin() {
            ui.appScreen.classList.add('hidden');
            ui.appScreen.classList.remove('flex');
            ui.loginScreen.classList.remove('hidden');
            ui.usernameInput.value = '';
            ui.passwordInput.value = '';
        }

        ui.tabBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentTab = e.currentTarget.getAttribute('data-tab');
                searchQuery = ''; 
                ui.searchInput.value = '';
                
                ui.btnDeletedZone.classList.remove('bg-custom-dark', 'text-white');
                ui.btnDeletedZone.classList.add('bg-custom-base', 'text-custom-dark');

                ui.tabBtns.forEach(b => {
                    const indicator = b.querySelector('.tab-indicator');
                    b.classList.remove('text-custom-dark', 'active');
                    b.classList.add('text-custom-dark/50');
                    indicator.classList.replace('w-full', 'w-0');
                });

                const activeBtn = e.currentTarget;
                const activeIndicator = activeBtn.querySelector('.tab-indicator');
                activeBtn.classList.remove('text-custom-dark/50');
                activeBtn.classList.add('text-custom-dark', 'active');
                activeIndicator.classList.replace('w-0', 'w-full');
                
                renderView();
            });
        });

        function switchToDeletedZone() {
            currentTab = 'deleted';
            searchQuery = '';
            ui.searchInput.value = '';
            
            ui.tabBtns.forEach(b => {
                const indicator = b.querySelector('.tab-indicator');
                b.classList.remove('text-custom-dark', 'active');
                b.classList.add('text-custom-dark/50');
                indicator.classList.replace('w-full', 'w-0');
            });
            
            ui.btnDeletedZone.classList.remove('bg-custom-base', 'text-custom-dark');
            ui.btnDeletedZone.classList.add('bg-custom-dark', 'text-white');
            
            renderView();
        }

        function updateBadges() {
            const safeCount = dbItems.filter(i => i.status === 'active' && i.category === 'safe').length;
            const retCount = dbItems.filter(i => i.status === 'active' && i.category === 'retention').length;
            
            ui.countSafe.innerText = safeCount;
            ui.countRetention.innerText = retCount;

            if(currentTab === 'safe') {
                ui.countSafe.className = 'bg-custom-accent text-white px-2 py-0.5 rounded-full text-[10px] font-bold transition-all ml-1';
                ui.countRetention.className = 'bg-custom-dark/10 text-custom-dark px-2 py-0.5 rounded-full text-[10px] font-bold transition-all ml-1';
            } else if (currentTab === 'retention') {
                ui.countRetention.className = 'bg-custom-accent text-white px-2 py-0.5 rounded-full text-[10px] font-bold transition-all ml-1';
                ui.countSafe.className = 'bg-custom-dark/10 text-custom-dark px-2 py-0.5 rounded-full text-[10px] font-bold transition-all ml-1';
            } else {
                ui.countSafe.className = 'bg-custom-dark/10 text-custom-dark px-2 py-0.5 rounded-full text-[10px] font-bold transition-all ml-1';
                ui.countRetention.className = 'bg-custom-dark/10 text-custom-dark px-2 py-0.5 rounded-full text-[10px] font-bold transition-all ml-1';
            }
        }

        function renderView() {
            updateBadges();
            if (currentTab === 'deleted') {
                ui.interactiveSection.classList.add('hidden');
                ui.searchSection.classList.remove('hidden');
                ui.listTitle.innerHTML = `<i class="fas fa-archive text-custom-dark/40 mr-2"></i> 所有歷史刪除紀錄`;
                renderList(true);
            } else {
                ui.interactiveSection.classList.remove('hidden');
                ui.searchSection.classList.add('hidden');
                renderMonthsGrid();
                renderList(false);
            }
        }

        function renderMonthsGrid() {
            ui.monthsGrid.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                const hasItems = dbItems.some(item => item.status === 'active' && item.category === currentTab && item.month === i);
                const isSelected = i === currentMonth;
                const btn = document.createElement('button');
                btn.className = `min-w-[50px] lg:min-w-[56px] flex-shrink-0 h-[50px] lg:h-[56px] rounded-xl flex flex-col items-center justify-center transition-all duration-200 border `;
                
                if (hasItems) {
                    btn.classList.add('bg-custom-accent', 'border-custom-accent', 'text-white');
                    if (!isSelected) btn.classList.add('opacity-80', 'hover:opacity-100');
                } else if (isSelected) {
                    btn.classList.add('border-custom-accent', 'bg-white', 'text-custom-accent');
                } else {
                    btn.classList.add('border-custom-dark/10', 'bg-white', 'text-custom-dark/40', 'hover:bg-custom-base');
                }

                btn.innerHTML = `
                    <span class="text-base lg:text-lg font-bold leading-none mb-0.5">${i}</span>
                    <span class="text-[9px] tracking-widest uppercase opacity-80">月</span>
                `;
                btn.onclick = () => { currentMonth = i; renderView(); };
                ui.monthsGrid.appendChild(btn);
            }
        }

        function renderList(isDeleted) {
            ui.listContainer.innerHTML = '';
            let list = [];
            
            if (isDeleted) {
                list = dbItems.filter(item => item.status === 'deleted');
                if (searchQuery) {
                    list = list.filter(item => 
                        item.date.includes(searchQuery) ||
                        item.room.toLowerCase().includes(searchQuery) ||
                        item.name.toLowerCase().includes(searchQuery) ||
                        (item.note && item.note.toLowerCase().includes(searchQuery)) ||
                        (item.finder && item.finder.toLowerCase().includes(searchQuery))
                    );
                }
                list.sort((a, b) => new Date(b.deletedAtStr) - new Date(a.deletedAtStr));
            } else {
                list = dbItems.filter(item => item.status === 'active' && item.category === currentTab && item.month === currentMonth);
                list.sort((a, b) => new Date(a.date) - new Date(b.date));
                
                const catName = currentTab === 'safe' ? '保險箱' : '保留區';
                ui.listTitle.innerHTML = `
                    <span class="text-custom-accent font-bold">${currentMonth}月份</span> 
                    <span class="mx-1.5">-</span>
                    <span>${catName}清單</span> 
                    <span class="text-custom-dark/50 text-xs font-normal ml-2 tracking-normal">(共 ${list.length} 件)</span>
                `;
            }

            if (list.length === 0) {
                ui.emptyState.classList.remove('hidden');
                ui.emptyState.classList.add('flex');
                ui.emptyStateText.innerText = isDeleted ? (searchQuery ? "找不到符合的結果" : "目前沒有刪除紀錄") : "這個月份沒有紀錄";
            } else {
                ui.emptyState.classList.add('hidden');
                ui.emptyState.classList.remove('flex');
                list.forEach(item => {
                    ui.listContainer.insertAdjacentHTML('beforeend', isDeleted ? createDeletedRow(item) : createActiveRow(item));
                });
            }
        }

        function createActiveRow(item) {
            return `
            <div class="flex flex-col md:flex-row md:items-center justify-between p-4 px-6 border-b border-custom-dark/5 hover:bg-custom-base/30 transition-colors gap-3">
                <div class="flex-1 flex flex-col md:flex-row md:items-center gap-3 md:gap-6 min-w-0">
                    <div class="flex items-center gap-3 md:w-32 shrink-0">
                        <span class="text-xs font-bold text-custom-dark/50 tracking-wider">${item.date}</span>
                    </div>
                    <div class="flex flex-col min-w-0 flex-1">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-custom-dark text-lg whitespace-nowrap">Rm ${item.room}</span>
                            <h4 class="font-bold text-custom-dark/80 text-base truncate">${item.name}</h4>
                        </div>
                        <div class="flex items-center gap-4 mt-0.5 text-[11px] text-custom-dark/50">
                            ${item.finder ? `<span>拾獲人: ${item.finder}</span>` : ''}
                            ${item.note ? `<span><i class="fas fa-quote-left text-[9px] opacity-50 mr-1"></i>${item.note}</span>` : ''}
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-4 shrink-0 self-end md:self-auto mt-2 md:mt-0">
                    <div class="text-[10px] text-right text-custom-dark/40 mr-2 hidden sm:block">
                        建檔<br><span class="font-bold tracking-wide">${item.addedBy}</span>
                    </div>
                    <button onclick="openRetrieveModal('${item.id}')" class="px-4 py-1.5 border border-custom-accent text-custom-accent hover:bg-custom-accent hover:text-white rounded text-xs font-bold transition-colors">
                        取出
                    </button>
                </div>
            </div>`;
        }

        function createDeletedRow(item) {
            const reasonBadge = item.deleteReason === 'guest' 
                ? `<span class="text-custom-accent text-[11px] font-bold"><i class="fas fa-user-check mr-1"></i>客人取走</span>`
                : `<span class="text-custom-dark/60 text-[11px] font-bold"><i class="fas fa-trash-alt mr-1"></i>逾期整理</span>`;
            const originName = item.category === 'safe' ? '保險箱' : '保留區';

            return `
            <div class="flex flex-col md:flex-row md:items-center justify-between p-4 px-6 border-b border-custom-dark/5 hover:bg-custom-base/30 transition-colors gap-3 opacity-90 bg-white">
                <div class="flex-1 flex flex-col md:flex-row md:items-center gap-3 md:gap-6 min-w-0">
                    <div class="flex items-center gap-3 md:w-32 shrink-0">
                        <span class="text-[10px] px-1.5 py-0.5 bg-custom-base text-custom-dark/60 rounded border border-custom-dark/10">${originName}</span>
                        <span class="text-xs font-bold text-custom-dark/40 tracking-wider line-through decoration-custom-dark/20">${item.date}</span>
                    </div>
                    <div class="flex flex-col min-w-0 flex-1">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-custom-dark/50 text-lg whitespace-nowrap line-through decoration-custom-dark/20">Rm ${item.room}</span>
                            <h4 class="font-bold text-custom-dark/50 text-base truncate line-through decoration-custom-dark/20">${item.name}</h4>
                            <div class="ml-2 bg-custom-base/50 px-2 py-0.5 rounded border border-custom-dark/5">${reasonBadge}</div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-end shrink-0 self-end md:self-auto text-[10px] text-custom-dark/50 mt-2 md:mt-0 bg-custom-base/40 px-3 py-1.5 rounded">
                    <div>處理人: <span class="font-bold">${item.deletedBy}</span></div>
                    <div>${item.deletedAtStr}</div>
                </div>
            </div>`;
        }

        function openAddModal() {
            if(currentTab !== 'deleted') {
                document.getElementById('add-category').value = currentTab;
            } else {
                document.getElementById('add-category').value = 'safe';
            }
            document.getElementById('add-room').value = '';
            document.getElementById('add-name').value = '';
            document.getElementById('add-finder').value = '';
            document.getElementById('add-note').value = '';
            
            ui.addModal.classList.remove('hidden');
            ui.addModal.querySelector('div').classList.remove('modal-enter');
            ui.addModal.querySelector('div').classList.add('modal-enter-active');
        }

        function closeAddModal() {
            ui.addModal.querySelector('div').classList.remove('modal-enter-active');
            ui.addModal.querySelector('div').classList.add('modal-enter');
            setTimeout(() => { ui.addModal.classList.add('hidden'); }, 250);
        }

        // --- 樂觀更新：秒加物品 ---
        async function submitAddItem() {
            const cat = document.getElementById('add-category').value;
            const dateVal = document.getElementById('add-date').value;
            const room = document.getElementById('add-room').value.trim();
            const name = document.getElementById('add-name').value.trim();
            const finder = document.getElementById('add-finder').value.trim();
            const note = document.getElementById('add-note').value.trim();

            if (!dateVal || !room || !name) {
                return showToast('請填寫日期、房號與物品名稱', 'error');
            }

            const parsedMonth = parseInt(dateVal.split('-')[1], 10);
            const mappedTab = cat === 'safe' ? '保險箱' : '保留區';

            // 1. 瞬間塞入本地記憶體並重繪
            const tempId = 'temp_' + Date.now().toString();
            dbItems.push({
                id: tempId, category: cat, date: dateVal, month: parsedMonth,
                room: room, name: name, finder: finder, note: note,
                status: 'active', addedBy: currentUser
            });
            
            closeAddModal();
            showToast(`✅ 已新增：Rm ${room} ${name} (背景同步中...)`, 'success');
            
            currentTab = cat;
            currentMonth = parsedMonth;
            ui.btnDeletedZone.classList.remove('bg-custom-dark', 'text-white');
            ui.btnDeletedZone.classList.add('bg-custom-base', 'text-custom-dark');
            renderView(); 

            // 2. 背景發送給 Google 試算表
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "addItem", tab: mappedTab, date: dateVal, month: parsedMonth,
                        room: room, itemName: name, finder: finder, notes: note,
                        username: currentUser, password: currentPassword
                    })
                });
                loadDataBackground(); // 同步回最新 ID
            } catch(e) {
                showToast("⚠️ 背景同步失敗，請檢查網路連線", "error");
            }
        }

        function openRetrieveModal(id) {
            const item = dbItems.find(i => i.id === id);
            if (!item) return;
            itemToRetrieve = id;
            document.getElementById('retrieve-room').innerText = item.room;
            document.getElementById('retrieve-name').innerText = item.name;
            
            ui.retrieveModal.classList.remove('hidden');
            requestAnimationFrame(() => {
                ui.retrieveModalContent.classList.remove('scale-95', 'opacity-0');
                ui.retrieveModalContent.classList.add('scale-100', 'opacity-100');
            });
        }

        function closeRetrieveModal() {
            ui.retrieveModalContent.classList.remove('scale-100', 'opacity-100');
            ui.retrieveModalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                ui.retrieveModal.classList.add('hidden');
                itemToRetrieve = null;
            }, 200);
        }

        // --- 樂觀更新：秒刪物品 ---
        async function executeRetrieve(reason) {
            if (!itemToRetrieve) return;
            const item = dbItems.find(i => i.id === itemToRetrieve);
            
            if (item) {
                const mappedTab = item.category === 'safe' ? '保險箱' : '保留區';
                const mappedReason = reason === 'guest' ? '客人取走' : '逾期整理';

                // 1. 瞬間修改本地狀態並重繪
                item.status = 'deleted';
                item.deleteReason = reason;
                item.deletedBy = currentUser;
                const now = new Date();
                item.deletedAtStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                
                closeRetrieveModal();
                const msg = reason === 'guest' ? '✅ 客人已取走 (背景同步中...)' : '✅ 已逾期整理 (背景同步中...)';
                showToast(msg, 'success');
                renderView();

                // 2. 背景通知 Google 試算表
                try {
                    await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "deleteItem", tab: mappedTab, id: item.id, retrieveType: mappedReason,
                            username: currentUser, password: currentPassword
                        })
                    });
                    loadDataBackground();
                } catch(e) {
                    showToast("⚠️ 更新失敗，請檢查網路", "error");
                }
            } else {
                closeRetrieveModal();
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const style = type === 'success' ? 'bg-custom-dark text-white' : 'bg-red-500 text-white';
            const icon = type === 'success' ? 'fa-check' : 'fa-exclamation-triangle';
            
            toast.className = `${style} px-5 py-2.5 rounded shadow-lg text-sm flex items-center gap-2 transform transition-all duration-300 -translate-y-full opacity-0`;
            toast.innerHTML = `<i class="fas ${icon}"></i> <span class="font-medium tracking-wide">${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('-translate-y-full', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('-translate-y-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
